# payments.raspberry-vision.cloud — HTTP → HTTPS redirect / ACME
<VirtualHost *:80>
    ServerName payments.raspberry-vision.cloud
    DocumentRoot /var/www/html
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
