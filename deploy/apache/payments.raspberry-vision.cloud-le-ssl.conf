# payments.raspberry-vision.cloud — reverse proxy to local upstream (TLS).

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName payments.raspberry-vision.cloud

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8117/
    ProxyPassReverse / http://127.0.0.1:8117/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    ErrorLog ${APACHE_LOG_DIR}/payments_raspberry_vision_cloud_error.log
    CustomLog ${APACHE_LOG_DIR}/payments_raspberry_vision_cloud_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/payments.raspberry-vision.cloud/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/payments.raspberry-vision.cloud/privkey.pem
</VirtualHost>
</IfModule>
