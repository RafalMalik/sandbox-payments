name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sandbox-payments-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      - run: go build -o bin/api ./cmd/api
      - name: Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

  deploy:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: payments-vps
    steps:
      - uses: actions/checkout@v4

      - name: Stage tree
        run: |
          mkdir -p staging/sandbox-payments
          rsync -a \
            --exclude staging \
            --exclude .git \
            --exclude .github \
            --exclude bin \
            --exclude data \
            --exclude .env \
            ./ staging/sandbox-payments/

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: staging/sandbox-payments
          target: /var/tmp/rvision-incoming/
          strip_components: 1
          overwrite: true
          rm: true

      - name: Install tree and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/raspberry-vision/sandbox-payments /var/tmp/rvision-incoming
            sudo chown -R ubuntu: /opt/raspberry-vision/sandbox-payments
            if [[ ! -f /opt/raspberry-vision/sandbox-payments/.env ]]; then
              echo "Missing /opt/raspberry-vision/sandbox-payments/.env — create it before deploy (PORT=8117, BASE_URL=https://payments.raspberry-vision.cloud)." >&2
              exit 1
            fi
            rsync -a --delete \
              --exclude .env \
              --exclude data \
              /var/tmp/rvision-incoming/sandbox-payments/ /opt/raspberry-vision/sandbox-payments/
            cd /opt/raspberry-vision/sandbox-payments
            docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
            ok=0
            for _ in $(seq 1 90); do
              if curl -sf http://127.0.0.1:8117/health | grep -q '"status":"ok"'; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1
            bash /opt/raspberry-vision/sandbox-payments/deploy/sync-apache.sh
            curl -sf https://payments.raspberry-vision.cloud/health | grep -q '"status":"ok"'
